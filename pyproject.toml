[project]
name = "rocket-league-replay-ml"
version = "1.0.0"
description = "Frame-level machine learning on Rocket League replays: win prediction, play-scheme classification, leakage checks"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Ciprian Tuzaru" }]
# Dependencies are pinned in requirements.txt / requirements-dev.txt.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
